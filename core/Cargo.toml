[package]
name = "tukzmon-core"
description = "Collectors, history, time axis, and drawing for tukzmon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "tukzmon_core"

[dependencies]
knobs = { path = "../knobs" }
shcl.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
# The cicd profiler step's sampler, for examples/profile.rs only.
pprof = { version = "0.15", default-features = false, optional = true }
# Not through pprof's flamegraph feature, whose inferno 0.11 brings a
# quick-xml with advisories.
inferno = { version = "0.12", default-features = false, optional = true }

[features]
profiling = ["dep:pprof", "dep:inferno"]

[[example]]
name = "profile"
required-features = ["profiling"]

[lints]
workspace = true

[dev-dependencies]
dhat = "0.3.3"
