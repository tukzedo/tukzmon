# cargo-deny's settings. cicd.bash runs only its advisories check, which
# fails the run on any crate in Cargo.lock that RustSec lists as vulnerable,
# unsound, unmaintained, or yanked. An ignore here needs its reason.
[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
ignore = []
