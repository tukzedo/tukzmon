# Settings for black and ruff over the cicd's Python. tukzmon itself is Rust.

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP", "SIM", "RUF"]
# fName functions and camelCase locals are the house naming, as in silkterm.
ignore = ["N802", "N806"]
