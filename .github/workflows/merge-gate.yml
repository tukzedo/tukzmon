# The merge gate off this box: cicd.bash --merge-gate on a push or pull
# request against main, or by hand on any branch. It builds the image from
# cicd/container each time and runs the checks in it, as the pre-push hook
# does locally. Linux only for now.
name: merge-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Pinned by commit, since a tag can be moved. The containers mount the
      # checkout, so it keeps no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: merge gate
        env:
          HOST_TEMP: ${{ runner.temp }}
        run: cicd/cicd.bash --merge-gate
